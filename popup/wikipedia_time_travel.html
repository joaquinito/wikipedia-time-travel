<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wikipedia Time Travel</title>
  <link rel="stylesheet" type="text/css" href="wikipedia_time_travel.css">
  <script src="../shared/mediawiki.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="wikipedia_time_travel.js"></script>
</head>
<body>

  <header id="extension-header">
    <!-- Inline SVG so the mark inherits the text colour in light and dark mode -->
    <svg id="extension-logo" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 3.5 A6.5 6.5 0 1 1 3.5 10"/>
      <polygon points="7,3.5 10.4,1.2 10.4,5.8" fill="currentColor" stroke="none"/>
      <path d="M10 6.9 V10.2 H12.9"/>
    </svg>
    <h2 id="extension-title">Wikipedia Time Travel</h2>
  </header>

  <main id="content">

    <!-- Skeleton shown while the MediaWiki API call is in flight -->
    <div id="loader" aria-hidden="true">
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-block"></div>
    </div>

    <div id="loaded-content">

      <div id="placeholder-message" hidden>
        <svg class="placeholder-icon" viewBox="0 0 20 20" width="28" height="28" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="10" cy="10" r="7.2"/>
          <path d="M2.8 10h14.4M10 2.8c1.9 2 2.9 4.5 2.9 7.2s-1 5.2-2.9 7.2c-1.9-2-2.9-4.5-2.9-7.2s1-5.2 2.9-7.2z"/>
        </svg>
        <span class="placeholder-text">Open a Wikipedia page to use this extension.</span>
      </div>

      <div id="error-message" hidden>Could not load this page's history.</div>

      <div id="article-info">
        <div id="article-name"></div>
        <div id="article-meta">
          <svg class="meta-icon" viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="7"/>
            <path d="M10 5.6V10l3 1.8"/>
          </svg>
          <div id="article-creation-date"></div>
        </div>
      </div>

      <div id="form-body" hidden>
        <label id="date-picker-label" for="date-picker">Open this page on</label>
        <input type="date" id="date-picker">
        <button id="submit-button">
          <span class="button-label">Go</span>
          <svg class="button-icon" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h11M10.5 5.5 15 10l-4.5 4.5"/>
          </svg>
        </button>
      </div>

    </div>
  </main>

  <footer id="settings">
    <label id="in-page-widget-setting">
      <input type="checkbox" id="in-page-widget-checkbox">
      <span class="setting-text">
        <span class="setting-name">Show on Wikipedia pages</span>
        <span class="setting-hint" id="setting-hint">Adds a Time travel button next to the language menu.</span>
      </span>
    </label>
  </footer>

</body>
</html>
